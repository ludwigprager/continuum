# Enum codes -> labels. THE ONLY PLACE codes are defined.
#
# To add a code: add it under the group's `codes:` and to `order:`. Nothing
# else changes - not the JSON Schema, not validate.py.
# To add a whole group: add it here, then point a field at it in
# project.schema.json with  "x-taxonomy": "<group name>".
#
# labels are null on purpose. SPEC 12.1: the real labels are not known yet
# and inventing them would put invented words in front of management.
# validate.py warns about every null label, so this stays visible until fixed.
provisional: true

