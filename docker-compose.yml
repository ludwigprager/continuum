# One-shot jobs, not daemons (HANDOFF 8.3).
#
# The daily pipeline does NOT depend on this file: check.sh and the other
# entry points call `podman run` directly, because `podman compose` in 4.x
# delegates to whatever compose implementation happens to be installed and
# the behaviour varies by host. Compose is kept for the services that really
# are long-lived (serve, scheduler) and for people who prefer it.
#
# M1 ships check, shell and dev. import/report/serve/scheduler arrive with
# their milestones rather than being declared against tools that do not exist.

services:
  check:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    image: mig-pipeline:0.2.0
    # Not paranoia: the cheapest possible regression test for the air-gap
    # traps in HANDOFF 8.2.
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - .:/work:ro,z
    working_dir: /work
    command: ["python3", "tools/validate.py", "--projects", "projects", "--schema", "schema"]

  shell:
    image: mig-pipeline:0.2.0
    network_mode: none
    volumes:
      - .:/work:z
    working_dir: /work
    command: ["bash"]
    stdin_open: true
    tty: true

  # Warm container for the pre-commit hook. `docker compose up -d dev`, then
  # USE_WARM_CONTAINER=1. Purely a latency optimisation; nothing requires it.
  dev:
    image: mig-pipeline:0.2.0
    container_name: mig-dev
    network_mode: none
    volumes:
      - .:/work:z
    working_dir: /work
    command: ["sleep", "infinity"]
