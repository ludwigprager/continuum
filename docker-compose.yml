# One-shot jobs, not daemons (SPEC 8.3).
#
# The daily pipeline does NOT depend on this file: check.sh and the other
# entry points call `podman run` directly, because `podman compose` in 4.x
# delegates to whatever compose implementation happens to be installed and
# the behaviour varies by host. Compose is kept for the services that really
# are long-lived (serve, scheduler) and for people who prefer it.
#
# check, shell and dev only. import/report/serve/scheduler are not here: the
# pipeline is a sequence of tools and the order lives in ./report.sh, which
# knows how to pass the git provenance in. A `report` service would be a second
# copy of that order, in a file nothing tests, free to drift. Use ./report.sh.
#
# The image tag follows VERSION, the same way scripts/lib.sh derives it -
# but compose cannot read a file, so the fallback below is a literal and has
# to be bumped with VERSION. It drifted once already (M4 -> M5); if you find
# compose running an old image, this is why. Override with IMAGE_TAG in the
# environment or a .env file to avoid the question entirely.

services:
  check:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    image: continuum-pipeline:${IMAGE_TAG:-0.5.0}
    # Not paranoia: the cheapest possible regression test for the air-gap
    # traps in SPEC 8.2.
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - .:/work:ro,z
    working_dir: /work
    command: ["python3", "tools/validate.py", "--projects", "projects", "--schema", "schema"]

  shell:
    image: continuum-pipeline:${IMAGE_TAG:-0.5.0}
    network_mode: none
    volumes:
      - .:/work:z
    working_dir: /work
    command: ["bash"]
    stdin_open: true
    tty: true

  # Warm container for the pre-commit hook. `docker compose up -d dev`, then
  # USE_WARM_CONTAINER=1. Purely a latency optimisation; nothing requires it.
  dev:
    image: continuum-pipeline:${IMAGE_TAG:-0.5.0}
    container_name: continuum-dev
    network_mode: none
    volumes:
      - .:/work:z
    working_dir: /work
    command: ["sleep", "infinity"]
