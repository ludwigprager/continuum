# value_map.yaml - normalise the messy values found in the extract.
#
# Keyed by the TARGET path from mapping.yaml (not the column header), so
# renaming a column header does not invalidate this file.
#
#   target.path:
#     "MS-SQL": mssql             # rename
#     "MSSQL/Redis": [mssql, redis]   # split one cell into several values
#     "keine": null               # treat as not-set
#
# Values not listed here pass through unchanged, and are counted in
# import-report.md so you can see what you have not normalised yet.
#
# ---------------------------------------------------------------------------
# The rule that matters: the RIGHT-hand side must be a code that already exists
# in schema/taxonomy.yaml (or sites.yaml / teams.yaml for x-ref fields). This
# file translates the source system's spelling into the catalogue's vocabulary;
# it does not invent vocabulary.
#
# `profile` writes a starter version that slugifies everything - "CA-1": ca_1.
# That is wrong here and would fail validation: CA-1 is already the code, and
# ca_1 is not in the taxonomy. Where the source already speaks the vocabulary,
# the right edit is to delete the line.
# ---------------------------------------------------------------------------

values:
  # --- ownership.team_id -> teams.yaml ---------------------------------------
  ownership.team_id:
    "Team Alpha": team-alpha
    "Team Beta": team-beta
    "Team Gamma": team-gamma
    "Team Delta": team-delta

  # --- datacenter -> sites.yaml ----------------------------------------------
  # The extract spells one site two ways. Both are the same datacenter; the
  # merge reports such disagreements between files, and this is where the
  # decision that they mean the same thing is recorded (SPEC 5.4 rule 5).
  placement.environments[].datacenter:
    "MUC-01": muc-01
    "muc-01": muc-01
    "FRA-02": fra-02
    "BER-01": ber-01

  # --- datastores -> taxonomy group 'engine' ---------------------------------
  # Four spellings of one engine, and two cells that hold two engines each.
  # A list value splits the cell into separate datastore rows, which is what
  # makes "how many projects have DB2" countable.
  datastores[].engine:
    "MS-SQL": mssql
    "MSSQL": mssql
    "mssql": mssql
    "DB2": db2
    "db2": db2
    "Redis": redis
    "MSSQL/Redis": [mssql, redis]
    "DB2; Redis": [db2, redis]
    "keine": none          # the taxonomy code for "no datastore", not null:
                           # "this project has none" is an answer, and null
                           # would read as "nobody asked" (SPEC 5.1)

  # --- storage classes -> taxonomy group 'storage_class' ---------------------
  platform.storage_classes[]:
    "Block": block
    "block": block
    "object": object
    "block, object": [block, object]
    "block/object": [block, object]

  # --- OS family -> taxonomy group 'os_family' -------------------------------
  # The cell carries family and version ("RHEL 7.9"); only the family is a
  # code. The version is dropped rather than parsed - see mapping.yaml.
  placement.environments[].os.family:
    "Windows Server 2016": windows
    "Windows Server 2019": windows
    "RHEL 7.9": rhel
    "SLES 15": sles
    "AIX 7.2": aix

  # --- migration.strategy -> taxonomy group 'migration_strategy' -------------
  # Already the right vocabulary apart from capitalisation.
  migration.strategy:
    "Rehost": rehost
    "Retain": retain

  # --- migration.status -> taxonomy group 'migration_status' -----------------
  # German source, English codes.
  migration.status:
    "nicht bewertet": not_assessed
    "bewertet": assessed
    "in Arbeit": in_progress
    "migriert": migrated
    "?": unknown           # an explicit unknown, not a dropped row (SPEC 11)

  # --- classification.* and security_class -----------------------------------
  # Nothing here on purpose. CA-1, CB-3, S2 are already the taxonomy's own
  # codes, so they pass through untouched. The starter file had a line for
  # each, slugifying them into codes that do not exist.
