# mapping.yaml - one entry per column of import/merged.csv.
#
#   "<exact column header>": <target path in the project YAML>
#
# Target path syntax:
#   a.b.c          nested scalar          -> a: {b: {c: value}}
#   a.b[]          list of scalars        -> a: {b: [v1, v2]}
#   a.b[].c        list of objects        -> a: {b: [{c: v1}, {c: v2}]}
#   a.b[0].c       explicit list index
#   null           leave in _unmapped (the default for anything you delete)
#
# Columns you do not map are NOT lost: they are written to _unmapped in each
# project file, so you can promote them later.
#
# ---------------------------------------------------------------------------
# THIS IS THE ONE FILE YOU EDIT BY HAND, and it is specific to YOUR columns.
#
# `./import/import.sh profile` writes a starter version of it with every column
# listed and a slugified guess beside each - `"Datenbank": datenbank`. That
# guess is a placeholder, not an answer: it puts a German column name at the
# root of the file, where the schema has no such field, and validation fails
# with "unknown field". Editing each line to a real schema path is the work.
#
# What is below is the worked answer for the demo extract. Real extracts will
# have different headers; copy the SHAPE, not the left-hand side. Valid paths
# come from schema/project.schema.yaml - that file is the list of what exists.
# ---------------------------------------------------------------------------

# id column (detected): Projekt-Nr

columns:
  # The id column. It becomes the project id and the filename, so it does not
  # also need a field of its own - but keep it out of _unmapped, where it would
  # be duplicated into every file for nothing.
  "Projekt-Nr": null

  "Anwendungsname": name
  "Team": ownership.team_id                         # x-ref: teams
  "Standort RZ": placement.environments[].datacenter  # x-ref: sites

  "Klassifizierung A": classification.classification_a
  "Klassifizierung B": classification.classification_b
  "Sicherheitsklasse": classification.security_class

  # One cell can hold several engines ("DB2; Redis"), and the importer splits
  # on the separator it detected. [] makes each token its own datastore row,
  # which is the grain the report counts at.
  "Datenbank": datastores[].engine

  "Storage Klasse": platform.storage_classes[]
  "Storage (GB)": platform.storage_gb               # unit 'GB' stripped
  "CPU (Kerne)": platform.cpu_cores

  # The OS column carries family and version together ("Windows Server 2019").
  # Only the family is mapped: value_map.yaml reduces the whole string to a
  # taxonomy code, and the version is not recoverable from it reliably enough
  # to be worth inventing a field for.
  "Betriebssystem": placement.environments[].os.family
  "Betriebssystem EOL": placement.environments[].os.eol

  "Migrationsstrategie": migration.strategy
  "Status": migration.status

  # Deliberately unmapped -> _unmapped. Free text with no field to go in, and
  # a contact name that has no business in a catalogue every team can read.
  # Promoting either is one line here plus one field in the schema.
  "Ansprechpartner": null
  "Bemerkung": null

  "Altspalte": null    # empty in every row of this export
